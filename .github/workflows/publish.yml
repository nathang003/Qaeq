name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Qaeq.Tests.Unit/Qaeq.Tests.Unit.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Run integration tests
        run: dotnet test tests/Qaeq.Tests.Integration/Qaeq.Tests.Integration.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref }}"
          VERSION="${TAG#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet package
        run: dotnet pack src/Qaeq/Qaeq.csproj --configuration Release --no-build /p:Version=${{ steps.version.outputs.version }} --output ./nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push "./nupkg/Qaeq.${{ steps.version.outputs.version }}.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/nathang003/index.json