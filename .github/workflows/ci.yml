name: CI

on:
  push:
    branches: 
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Qaeq.Tests.Unit/Qaeq.Tests.Unit.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Run integration tests
        run: dotnet test tests/Qaeq.Tests.Integration/Qaeq.Tests.Integration.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Pack NuGet package
        run: dotnet pack src/Qaeq/Qaeq.csproj --configuration Release --no-build